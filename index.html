      <span class="top-sep" aria-hidden="true"></span>
      <div class="top-name"><span class="en">PROPOSAL BUILDER</span><b>活動企劃書產生器</b></div>
    </div>
    <div class="top-r">
      <button type="button" class="round" data-theme-toggle aria-label="切換深淺色"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"></path></svg></button>
    </div>
    <div class="hero-main">
      <div class="hero-l">
        <div class="eyebrow">ACTIVITY&nbsp;&nbsp;PROPOSAL<span>AY {{f.year}}</span></div>
        <div class="hero-title">
          <h1>活動企劃書</h1>
          <span class="pill">{{heroPill}}<span class="pill-zh">{{heroPillZh}}</span></span>
        </div>
      </div>
      <div class="hero-r" aria-label="目前步驟">
        <div class="bigdate">{{stepNum}}<small>/08</small></div>
        <div class="dow"><span>COMPLETED</span><span class="circ">{{doneCount}}/8</span></div>
      </div>
    </div>
  </header>

  <div class="hero-rule">
    <span class="sub">南臺科技大學 學務處課外活動組 企劃書格式</span>
    <div class="actions">
      <button type="button" class="btn icon" onClick="{{loadSample}}">載入範例資料</button>
      <button type="button" class="btn icon" onClick="{{goStart}}">回到開始</button>
    </div>
  </div>

  <main class="layout">

    <nav class="panel steps-panel" aria-label="填寫步驟">
      <div class="panel-head"><h2>填寫步驟<span class="en">STEPS</span><span class="count">{{doneCount}}</span></h2></div>
      <ol class="steps">
        <sc-for list="{{steps}}" as="st" hint-placeholder-count="8">
          <li>
            <button type="button" class="step {{st.cls}}" onClick="{{st.go}}" aria-current="{{st.aria}}">
              <span class="n">{{st.nn}}</span>
              <span class="lbl">{{st.label}}</span>
              <sc-if value="{{st.done}}" hint-placeholder-val="{{false}}"><span class="ok-dot" aria-label="已完成"></span></sc-if>
              <sc-if value="{{st.notDone}}" hint-placeholder-val="{{true}}"><span class="todo-dot" aria-hidden="true"></span></sc-if>
            </button>
          </li>
        </sc-for>
      </ol>
    </nav>

    <section class="panel" aria-label="填寫內容">

      <!-- 開始 -->
      <sc-if value="{{isS0}}" hint-placeholder-val="{{true}}">
        <div class="step-body" id="body-0">
          <div class="panel-head"><h2>開始<span class="en">START</span></h2></div>
          <p class="sub" style="margin: 0; font-size: 14px">照著步驟填，最後一鍵匯出符合學校格式的 Word 與 PDF。之前匯出的 Word 檔也能丟回來繼續改。</p>
          <div class="start">
            <button type="button" class="card" onClick="{{startNew}}">
              <span class="k">01 — NEW</span>
              <span class="t">建立新企劃書</span>
              <span class="sub">從空白開始，一步一步填寫活動資訊。</span>
            </button>
            <label class="card dashed">
              <span class="k">02 — IMPORT</span>
              <span class="t">匯入 Word 原檔</span>
              <span class="sub">選擇用本工具匯出的 .docx，內容會自動帶回各步驟。</span>
              <input type="file" accept=".docx" onChange="{{onImport}}">
            </label>
          </div>
          <p class="note"><b>固定條文自動帶入：</b>一般規定或注意事項、緊急應變措施與性平宣導六點，會依學校範本原文放進企劃書，不用重打。</p>
        </div>
      </sc-if>

      <!-- 1 基本資料 -->
      <sc-if value="{{isS1}}" hint-placeholder-val="{{false}}">
        <div class="step-body" id="body-1">
          <div class="panel-head"><h2>{{stepTitle}}<span class="en">{{stepEn}}</span></h2></div>
          <p class="sub" style="margin: 0">{{stepHint}}</p>
          <div class="fields">
            <label class="field">學年度<input type="text" inputmode="numeric" value="{{f.year}}" onChange="{{on.year}}" placeholder="115"></label>
            <label class="field">學期<select value="{{f.term}}" onChange="{{on.term}}"><option value="第一學期">第一學期</option><option value="第二學期">第二學期</option><option value="暑假">暑假</option><option value="寒假">寒假</option></select></label>
            <label class="field"><span>主辦單位<span class="req">*</span></span><input type="text" value="{{f.org}}" onChange="{{on.org}}" placeholder="例：資訊工程系學會"></label>
            <label class="field">協辦單位<input type="text" value="{{f.coOrg}}" onChange="{{on.coOrg}}" placeholder="沒有可留空"></label>
            <label class="field"><span>活動類型<span class="req">*</span></span><select value="{{f.type}}" onChange="{{on.type}}"><option value="">請選擇</option><option value="幹部訓練">幹部訓練</option><option value="校內展演">校內展演</option><option value="成果發表">成果發表</option><option value="校外競賽">校外競賽</option><option value="迎新活動">迎新活動</option><option value="服務學習">服務學習</option><option value="講座">講座</option><option value="其他">其他</option></select></label>
            <label class="field"><span>活動名稱<span class="req">*</span></span><input type="text" value="{{f.name}}" onChange="{{on.name}}" placeholder="會顯示在『』裡"></label>
            <label class="field"><span>活動負責人<span class="req">*</span></span><input type="text" value="{{f.leader}}" onChange="{{on.leader}}" placeholder="姓名"></label>
            <label class="field"><span>負責人電話<span class="req">*</span></span><input type="tel" value="{{f.phone}}" onChange="{{on.phone}}" placeholder="09xx-xxx-xxx"></label>
            <label class="field"><span>指導／帶隊老師<span class="req">*</span></span><input type="text" value="{{f.advisor}}" onChange="{{on.advisor}}" placeholder="例：王小明老師"></label>
            <label class="field">指導單位<input type="text" value="{{f.guide}}" onChange="{{on.guide}}"></label>
          </div>
        </div>
      </sc-if>

      <!-- 2 時間地點 -->
      <sc-if value="{{isS2}}" hint-placeholder-val="{{false}}">
        <div class="step-body" id="body-2">
          <div class="panel-head"><h2>{{stepTitle}}<span class="en">{{stepEn}}</span></h2></div>
          <p class="sub" style="margin: 0">{{stepHint}}</p>
          <div class="fields">
            <label class="field"><span>活動日期<span class="req">*</span></span><input type="date" value="{{f.date}}" onChange="{{on.date}}"></label>
            <label class="field"><span>開始時間<span class="req">*</span></span><input type="time" value="{{f.start}}" onChange="{{on.start}}"></label>
            <label class="field"><span>結束時間<span class="req">*</span></span><input type="time" value="{{f.end}}" onChange="{{on.end}}"></label>
            <label class="field"><span>活動地點<span class="req">*</span></span><input type="text" value="{{f.place}}" onChange="{{on.place}}" placeholder="例：三連堂"></label>
          </div>
          <p class="note">企劃書會寫成：<b>{{pv.time.t}}</b></p>
          <div class="fields">
            <label class="field">活動對象<input type="text" value="{{f.target}}" onChange="{{on.target}}" placeholder="例：全校學生"></label>
            <label class="field"><span>工作人員人數<span class="req">*</span></span><input type="number" min="0" value="{{f.staffCount}}" onChange="{{on.staffCount}}"></label>
            <label class="field"><span>預計參與人數<span class="req">*</span></span><input type="number" min="0" value="{{f.participants}}" onChange="{{on.participants}}"></label>
            <div class="field">合計<div class="readout">{{totalPeople}}&nbsp;<span class="sub">人</span></div></div>
          </div>
          <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
            <legend class="field" style="padding: 0; margin-bottom: 10px">有無收費</legend>
            <div class="choice">
              <button type="button" class="tag {{feeNoCls}}" onClick="{{feeNo}}" aria-pressed="{{feeNoOn}}">無收費</button>
              <button type="button" class="tag {{feeYesCls}}" onClick="{{feeYes}}" aria-pressed="{{feeYesOn}}">有收費</button>
            </div>
            <sc-if value="{{feeYesOn}}" hint-placeholder-val="{{false}}">
              <label class="field">收費說明（會附預計收支明細）<input type="text" value="{{f.feeNote}}" onChange="{{on.feeNote}}" placeholder="例：每人報名費 200 元，含午餐與保險"></label>
            </sc-if>
          </fieldset>
        </div>
      </sc-if>

      <!-- 3 內容 -->
      <sc-if value="{{isS3}}" hint-placeholder-val="{{false}}">
        <div class="step-body" id="body-3">
          <div class="panel-head"><h2>{{stepTitle}}<span class="en">{{stepEn}}</span></h2></div>
          <p class="sub" style="margin: 0">{{stepHint}}</p>
          <label class="field"><span>活動主旨<span class="req">*</span></span><span class="help">簡略說明辦理此活動的主要目的。</span>
            <textarea value="{{f.purpose}}" onChange="{{on.purpose}}" placeholder="例：辦理全校性幹部訓練，邀集各社團及系學會共同參與研習，以提升學生社團活動量能。"></textarea></label>
          <label class="field"><span>實施方式與內容<span class="req">*</span></span><span class="help">活動進行方式、競賽規定、辦理內容等。</span>
            <textarea value="{{f.method}}" onChange="{{on.method}}" style="min-height: 160px"></textarea></label>
          <label class="field"><span>預期效益<span class="req">*</span></span><span class="help">預計達成的質化與量化目標，例如參與人次。</span>
            <textarea value="{{f.benefit}}" onChange="{{on.benefit}}" placeholder="例：提升各社團及系學會幹部職能，預計參與人次達 200 人。"></textarea></label>
          <label class="field">補充注意事項（選填）<span class="help">固定的三條一般規定會自動帶入，這裡只填這次活動特有的，例如用火、化學藥品的防護措施。</span>
            <textarea value="{{f.extraNotes}}" onChange="{{on.extraNotes}}" style="min-height: 90px"></textarea></label>
        </div>
      </sc-if>

      <!-- 4 人員配置 -->
      <sc-if value="{{isS4}}" hint-placeholder-val="{{false}}">
        <div class="step-body" id="body-4">
          <div class="panel-head"><h2>{{stepTitle}}<span class="en">{{stepEn}}</span><span class="count">{{staffFilled}}</span></h2></div>
          <p class="sub" style="margin: 0">{{stepHint}}</p>
          <div class="tbl"><div class="tbl-in">
            <div class="tr th" style="grid-template-columns: 40px 110px 130px 130px minmax(0, 1fr) 130px"><span></span><span>職稱</span><span>姓名</span><span>學號</span><span>工作內容</span><span>備註</span></div>
            <sc-for list="{{staffRows}}" as="r" hint-placeholder-count="9">
              <div class="tr" style="grid-template-columns: 40px 110px 130px 130px minmax(0, 1fr) 130px">
                <button type="button" class="x" onClick="{{r.remove}}" aria-label="刪除這一列"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
                <input type="text" aria-label="職稱" value="{{r.title}}" onChange="{{r.on.title}}">
                <input type="text" aria-label="姓名" value="{{r.name}}" onChange="{{r.on.name}}">
                <input type="text" aria-label="學號" value="{{r.sid}}" onChange="{{r.on.sid}}">
                <input type="text" aria-label="工作內容" value="{{r.job}}" onChange="{{r.on.job}}">
                <input type="text" aria-label="備註" value="{{r.note}}" onChange="{{r.on.note}}">
              </div>
            </sc-for>
          </div></div>
          <button type="button" class="btn ghost add-row" onClick="{{addStaff}}">＋ 新增一列</button>
        </div>
      </sc-if>

      <!-- 5 活動流程 -->
      <sc-if value="{{isS5}}" hint-placeholder-val="{{false}}">
        <div class="step-body" id="body-5">
          <div class="panel-head"><h2>{{stepTitle}}<span class="en">{{stepEn}}</span><span class="count">{{flowFilled}}</span></h2></div>
          <p class="sub" style="margin: 0">{{stepHint}}</p>
          <div class="tbl"><div class="tbl-in">
            <div class="tr th" style="grid-template-columns: 40px 90px 150px minmax(0, 1fr) 130px 120px"><span></span><span>日期</span><span>時間</span><span>活動內容</span><span>地點</span><span>備註</span></div>
            <sc-for list="{{flowRows}}" as="r" hint-placeholder-count="4">
              <div class="tr" style="grid-template-columns: 40px 90px 150px minmax(0, 1fr) 130px 120px">
                <button type="button" class="x" onClick="{{r.remove}}" aria-label="刪除這一列"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
                <input type="text" aria-label="日期" value="{{r.date}}" onChange="{{r.on.date}}" placeholder="9/26">
                <input type="text" aria-label="時間" value="{{r.time}}" onChange="{{r.on.time}}" placeholder="08:00~09:00">
                <input type="text" aria-label="活動內容" value="{{r.content}}" onChange="{{r.on.content}}">
                <input type="text" aria-label="地點" value="{{r.place}}" onChange="{{r.on.place}}">
                <input type="text" aria-label="備註" value="{{r.note}}" onChange="{{r.on.note}}">
              </div>
            </sc-for>
          </div></div>
          <div class="actions">
            <button type="button" class="btn ghost" onClick="{{addFlow}}">＋ 新增一列</button>
            <button type="button" class="btn" onClick="{{addPrePost}}">帶入「場地佈置」與「場復」</button>
          </div>
        </div>
      </sc-if>

      <!-- 6 經費 -->
      <sc-if value="{{isS6}}" hint-placeholder-val="{{false}}">
        <div class="step-body" id="body-6">
          <div class="panel-head"><h2>{{stepTitle}}<span class="en">{{stepEn}}</span></h2></div>
          <p class="sub" style="margin: 0">{{stepHint}}</p>
          <div class="tbl"><div class="tbl-in" style="min-width: 880px">
            <div class="tr th" style="grid-template-columns: 40px 36px 130px 100px 80px 76px 100px 120px minmax(0, 1fr)"><span></span><span>項次</span><span>項目</span><span>單價</span><span>數量</span><span>單位</span><span>金額</span><span>經費來源</span><span>說明</span></div>
            <sc-for list="{{budgetRows}}" as="r" hint-placeholder-count="5">
              <div class="tr" style="grid-template-columns: 40px 36px 130px 100px 80px 76px 100px 120px minmax(0, 1fr)">
                <button type="button" class="x" onClick="{{r.remove}}" aria-label="刪除這一列"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
                <span class="idx">{{r.idx}}</span>
                <input type="text" aria-label="項目" value="{{r.item}}" onChange="{{r.on.item}}">
                <input type="number" min="0" aria-label="單價" value="{{r.price}}" onChange="{{r.on.price}}">
                <input type="number" min="0" aria-label="數量" value="{{r.qty}}" onChange="{{r.on.qty}}">
                <input type="text" aria-label="單位" value="{{r.unit}}" onChange="{{r.on.unit}}">
                <span class="amt">{{r.amountStr}}</span>
                <select aria-label="經費來源" value="{{r.source}}" onChange="{{r.on.source}}"><option value="學輔支應">學輔支應</option><option value="社團自籌">社團自籌</option></select>
                <input type="text" aria-label="說明" value="{{r.note}}" onChange="{{r.on.note}}">
              </div>
            </sc-for>
          </div></div>
          <button type="button" class="btn ghost add-row" onClick="{{addBudget}}">＋ 新增經費項目</button>
          <div class="stats">
            <div class="stat"><div class="k">經費總計 TOTAL</div><div class="v">{{totalStr}}<small>元</small></div></div>
            <div class="stat"><div class="k">學輔支應 {{subsidyIdx}}</div><div class="v">{{subsidyStr}}<small>元</small></div></div>
            <div class="stat"><div class="k">社團自籌 {{selfIdx}}</div><div class="v">{{selfStr}}<small>元</small></div></div>
          </div>
          <sc-if value="{{needQuote}}" hint-placeholder-val="{{false}}">
            <div class="warn" role="note"><span class="live-dot" aria-hidden="true"></span>有單項超過 1 萬元，記得附上估價單（第 7 步會提醒）。</div>
          </sc-if>
        </div>
      </sc-if>

      <!-- 7 自我檢核 -->
      <sc-if value="{{isS7}}" hint-placeholder-val="{{false}}">
        <div class="step-body" id="body-7">
          <div class="panel-head"><h2>{{stepTitle}}<span class="en">{{stepEn}}</span><span class="count">{{checkedCount}}/8</span></h2></div>
          <p class="sub" style="margin: 0">{{stepHint}}</p>
          <div>
            <sc-for list="{{checks}}" as="c" hint-placeholder-count="8">
              <fieldset class="q" style="margin: 0; border-left: 0; border-right: 0; border-bottom: 0">
                <legend style="float: left; padding: 0; max-width: 100%" class="qt"><span class="qn">{{c.nn}}</span>{{c.q}} <span class="sub">{{c.hint}}</span></legend>
                <div class="choice">
                  <sc-for list="{{c.opts}}" as="o" hint-placeholder-count="2">
                    <button type="button" class="tag {{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.on}}">{{o.label}}</button>
                  </sc-for>
                </div>
              </fieldset>
            </sc-for>
          </div>
          <label class="field">說明（第 8 項選「是」時填寫）<textarea value="{{f.checkNote}}" onChange="{{on.checkNote}}" style="min-height: 80px"></textarea></label>
          <a href="https://reurl.cc/orY7eD" style="font-size: 14px">核銷流程說明（學校連結）</a>
        </div>
      </sc-if>

      <!-- 8 匯出 -->
      <sc-if value="{{isS8}}" hint-placeholder-val="{{false}}">
        <div class="step-body" id="body-8">
          <div class="panel-head"><h2>{{stepTitle}}<span class="en">{{stepEn}}</span></h2></div>
          <section class="uploads" aria-label="圖片與簽名">
            <div class="up-title">圖片與簽名<span class="en" style="margin-left: 8px">IMAGES</span><span class="sub" style="margin-left: auto; letter-spacing: 0">選填，放上去會出現在 Word 和 PDF 對應的位置</span></div>
            <div class="up-grid">
              <sc-for list="{{imgSlots}}" as="u" hint-placeholder-count="3">
                <div class="up {{u.cls}}">
                  <div class="up-head"><span class="up-t">{{u.label}}</span><span class="en">{{u.en}}</span></div>
                  <sc-if value="{{u.has}}" hint-placeholder-val="{{false}}">
                    <div class="up-img"><img src="{{u.src}}" alt="{{u.label}}"></div>
                  </sc-if>
                  <sc-if value="{{u.empty}}" hint-placeholder-val="{{true}}">
                    <div class="up-empty"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg><span>{{u.where}}</span></div>
                  </sc-if>
                  <div class="actions">
                    <label class="btn icon up-pick">{{u.pickLabel}}<input type="file" accept="image/*" class="sr" onChange="{{u.pick}}"></label>
                    <sc-if value="{{u.has}}" hint-placeholder-val="{{false}}"><button type="button" class="btn icon ghost" onClick="{{u.clear}}">移除</button></sc-if>
                  </div>
                  <p class="sub" style="margin: 0; font-size: 12px">{{u.note}}</p>
                </div>
              </sc-for>
            </div>
          </section>
          <sc-if value="{{hasMissing}}" hint-placeholder-val="{{true}}">
            <div class="missing">
              <p style="margin: 0; font-size: 14px">還有 <b class="jost" style="font-size: 18px">{{missingCount}}</b> 項沒填，匯出後會以紅字「○○」留空：</p>
              <ul class="chips">
                <sc-for list="{{missing}}" as="m" hint-placeholder-count="3">
                  <li><button type="button" class="chip" onClick="{{m.go}}"><span class="live-dot" aria-hidden="true"></span>{{m.text}}</button></li>
                </sc-for>
              </ul>
            </div>
          </sc-if>
          <sc-if value="{{noMissing}}" hint-placeholder-val="{{false}}">
            <div class="allset"><span class="ok-dot" aria-hidden="true"></span>所有必填資料都齊了，可以匯出</div>
          </sc-if>
          <label class="field">檔名<input type="text" value="{{fileName}}" onChange="{{on.fileName}}"></label>
          <div class="export-btns">
            <button type="button" class="btn primary big" onClick="{{exportWord}}" disabled="{{busyAny}}">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>
              {{wordLabel}}
            </button>
            <button type="button" class="btn big" onClick="{{exportPdf}}" disabled="{{busyAny}}">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>
              {{pdfLabel}}
            </button>
          </div>
          <p role="status" class="sys" style="color: {{sysColor}}"><span class="{{sysDot}}" aria-hidden="true"></span>{{sysLine}}</p>
          <sc-if value="{{hasJob}}" hint-placeholder-val="{{false}}">
            <section class="job" aria-label="匯出過程" aria-live="polite">
              <div class="job-head">
                <b>{{job.title}}<span class="en" style="margin-left: 8px">{{job.en}}</span></b>
                <span style="display: flex; align-items: baseline; gap: 10px"><span class="sub" style="color: {{job.statusColor}}">{{job.statusText}}</span><span class="job-pct">{{job.pct}}%</span></span>
              </div>
              <div class="linebar {{job.barCls}}" role="progressbar" aria-label="匯出進度" aria-valuenow="{{job.pct}}" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width: {{job.pct}}%"></div></div>
              <ol class="log">
                <sc-for list="{{job.stages}}" as="sg" hint-placeholder-count="5">
                  <li class="{{sg.cls}}" aria-current="{{sg.aria}}">
                    <span class="dot" aria-hidden="true"></span>
                    <span class="l">{{sg.label}}</span>
                    <span class="d">{{sg.detail}}</span>
                  </li>
                </sc-for>
              </ol>
              <sc-if value="{{job.hasThumbs}}" hint-placeholder-val="{{false}}">
                <div class="thumbs">
                  <sc-for list="{{job.thumbs}}" as="t" hint-placeholder-count="4">
                    <figure><img src="{{t.src}}" alt="{{t.label}}"><figcaption>{{t.label}}</figcaption></figure>
                  </sc-for>
                </div>
              </sc-if>
              <sc-if value="{{hasDl}}" hint-placeholder-val="{{false}}">
                <div class="actions" style="padding-top: 12px; border-top: 1px solid var(--hair); align-items: center">
                  <button type="button" class="btn neon" onClick="{{redownload}}" disabled="{{busyAny}}">再下載一次：{{dl.name}}</button>
                  <span class="sub jost">{{dl.size}}</span>
                </div>
              </sc-if>
            </section>
          </sc-if>
          <p class="sub" style="margin: 0">Word 直接套用學校原始範本（校徽、頁首、字型、表格版面不變），之後可以再匯入本工具繼續修改。指導老師簽章與負責人簽章欄位會留白，列印後親簽。</p>
        </div>
      </sc-if>

      <!-- 上一步 / 下一步 -->
      <sc-if value="{{inStep}}" hint-placeholder-val="{{false}}">
        <div class="foot" style="margin-top: 22px">
          <button type="button" class="btn" onClick="{{prev}}">← 上一步</button>
          <sc-if value="{{notLast}}" hint-placeholder-val="{{true}}">
            <button type="button" class="btn primary" onClick="{{next}}">下一步：{{nextLabel}} →</button>
          </sc-if>
        </div>
      </sc-if>
    </section>

    <!-- 預覽：與匯出的 Word 版面相同 -->
    <aside class="panel preview-col" aria-label="企劃書預覽">
      <div style="position: {{pz.pos}}; inset: {{pz.inset}}; z-index: {{pz.z}}; background: {{pz.bg}}; overflow: {{pz.ov}}; padding: {{pz.pad}}; display: flex; flex-direction: column; align-items: center; gap: 12px">
        <div style="width: 100%; max-width: {{pz.barW}}; display: flex; flex-direction: column; gap: 10px">
          <div class="panel-head" style="margin: 0"><h2 style="color: {{pz.head}}">預覽<span class="en">PREVIEW</span></h2>
            <button type="button" class="btn icon" onClick="{{toggleZoom}}">{{pz.btn}}</button></div>
          <div class="tabs" role="tablist" aria-label="預覽頁面">
            <sc-for list="{{pages}}" as="pg" hint-placeholder-count="4">
              <button type="button" role="tab" class="tab {{pg.cls}}" aria-selected="{{pg.sel}}" onClick="{{pg.go}}">{{pg.label}}</button>
            </sc-for>
          </div>
        </div>
        <article class="paper" style="width: 100%; max-width: 49.6em; min-height: 70.2em; box-sizing: border-box; padding: 3em 3.4em 1.6em; background: #FFFFFF; border: 1px solid #E2E2E8; box-shadow: 0 2px 4px rgba(17,17,20,0.06), 0 10px 24px -8px rgba(17,17,20,0.22); font-family: DFKai-SB, '標楷體', BiauKai, 'LXGW WenKai TC', serif; font-size: {{pz.font}}px; line-height: 1.5; color: #221F1F; display: flex; flex-direction: column">

          <!-- 封面 -->
          <sc-if value="{{isP1}}" hint-placeholder-val="{{true}}">
            <div style="flex: 1; display: flex; flex-direction: column">
