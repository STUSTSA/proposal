<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1200px;height:630px;background:#f5f0e1;font-family:"Jost","Noto Sans TC",sans-serif;color:#0a2a4d;overflow:hidden;position:relative}
.su-logo{height:58px;display:block} .su-logo .cls-1{fill:#f0bc23} .su-logo .cls-2{fill:#0a5baa} .su-logo .cls-3,.su-logo .cls-4{fill:#0a2a4d}
.l{position:absolute;left:80px;top:64px;width:660px}
.en{margin-top:70px;font-size:18px;letter-spacing:.24em;color:#6d6a5c}
h1{margin:12px 0 0;font-size:64px;white-space:nowrap;font-weight:700;letter-spacing:.06em;line-height:1.1}
p{margin:26px 0 0;font-size:26px;letter-spacing:.06em;color:#6d6a5c;line-height:1.6}
.chips{display:flex;gap:12px;margin-top:34px}
.chip{border-radius:999px;padding:10px 24px 8px;font-size:22px;font-weight:500;letter-spacing:.08em;background:#ebe2c8}
.chip.y{background:#f0bc23} .chip.n{background:#0a2a4d;color:#fffdf6}
.card{position:absolute;right:70px;top:70px;width:380px;height:490px;border-radius:28px;background:#fffdf6;box-shadow:0 30px 60px -30px rgba(10,42,77,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.card img{width:250px;height:250px}
.card .t{font-size:22px;letter-spacing:.22em;color:#6d6a5c}
.bar{width:220px;height:16px;border-radius:999px;background:#f0bc23}
.ln{width:260px;height:10px;border-radius:999px;background:#ebe2c8;margin-top:-12px}
.brand{display:flex;align-items:center;gap:18px;font-size:20px;letter-spacing:.24em;font-weight:500}.brand img{width:64px;height:64px}
.big{position:absolute;right:90px;top:135px;width:360px;height:360px}
</style></head><body>
<div class="l"><div class="brand"><img src="../icons/favicon.svg"><span>NOAH</span></div><div class="en">ACTIVITY PROPOSAL BUILDER</div><h1>Noah 企劃書</h1>
<p>照著步驟填寫，一鍵匯出符合學校格式的<br>活動企劃書 Word 與 PDF</p>
<div class="chips"><span class="chip y">Word</span><span class="chip n">PDF</span><span class="chip">課外活動組格式</span></div></div>
<img class="big" src="../icons/glyph.svg">
</body></html>
