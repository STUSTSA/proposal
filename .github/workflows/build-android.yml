name: build-android-apk

# 安卓 App：把網站打包進 APK（沒網路也能用）。main 有改動就重建，或到 Actions 手動執行。
# APK 放在 Release「apk-latest」：https://github.com/STUSTSA/proposal/releases/download/apk-latest/proposal.apk
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Copy website into the app
        run: |
          W=android/app/build/webassets/www
          mkdir -p "$W/assets"
          cp -r index.html manifest.webmanifest css js icons "$W/"
          cp assets/cover-seal.png "$W/assets/"
      - name: Prepare signing key (optional)
        env:
          KS: ${{ secrets.APP_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/app.jks"
            echo "APP_KEYSTORE=$RUNNER_TEMP/app.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::沒有設定 APP_KEYSTORE_B64，這次用臨時簽章；裝新版前要先移除舊版"
          fi
      - name: Build release APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: proposal-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish APK to release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk proposal.apk
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[]|select(.tag_name=="apk-latest")][0].id // empty')
          [ -n "$id" ] && gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false >/dev/null
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "安卓 APK（最新）" --notes "企劃書產生器安卓版" --target "$GITHUB_SHA"
          gh release upload apk-latest proposal.apk --clobber
          gh release edit apk-latest --draft=false --notes "企劃書產生器安卓版（版本 1.${{ github.run_number }}）。手機點這個連結直接下載安裝：https://github.com/$GITHUB_REPOSITORY/releases/download/apk-latest/proposal.apk"
